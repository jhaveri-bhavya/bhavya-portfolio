server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect with relative URLs so the host port mapping (e.g. 8080:80) is kept
    absolute_redirect off;

    # Convenience: send the bare host to the site's base path
    location = / {
        return 302 /bhavya-portfolio/;
    }

    location /bhavya-portfolio/ {
        try_files $uri $uri/ $uri.html /bhavya-portfolio/index.html;
    }

    # Long cache for hashed assets
    location /bhavya-portfolio/_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
